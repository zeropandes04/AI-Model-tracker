<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Comparison Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --star-filled: #fbbf24;
            --star-empty: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1, h2, h3 {
            margin-bottom: 1rem;
        }

        .app-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        /* Tabs */
        .tabs {
            margin-bottom: 2rem;
        }

        .tabs-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            max-width: 28rem;
            background: var(--bg-secondary);
            padding: 0.25rem;
            border-radius: 0.5rem;
            margin: 0 auto 2rem;
        }

        .tab-trigger {
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .tab-trigger:hover {
            background: var(--bg-tertiary);
        }

        .tab-trigger.active {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-small {
            padding: 0.375rem 0.75rem;
            font-size: 0.8rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 0.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
        }

        /* Scorecard for Best by Category */
        .scorecard {
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .scorecard-header {
            margin-bottom: 1.5rem;
        }

        .scorecard-category {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .scorecard-winner {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--success);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .scorecard-dimensions {
            margin-bottom: 1.5rem;
        }

        .dimension-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .dimension-row:last-child {
            border-bottom: none;
        }

        .dimension-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .scorecard-final {
            text-align: center;
            padding-top: 1rem;
            border-top: 2px solid var(--border);
        }

        .final-score-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .final-score-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Star Rating */
        .star-rating {
            display: inline-flex;
            gap: 0.25rem;
        }

        .star {
            font-size: 1.2rem;
            color: var(--star-empty);
        }

        .star.filled {
            color: var(--star-filled);
        }

        .star-rating-input {
            display: flex;
            gap: 0.25rem;
        }

        .star-input {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--star-empty);
            transition: color 0.2s;
        }

        .star-input:hover,
        .star-input.active {
            color: var(--star-filled);
        }

        /* Category List */
        .category-list-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-list-item:hover {
            background: var(--bg-tertiary);
            transform: translateX(4px);
        }

        .category-list-name {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Category Detail */
        .back-btn {
            margin-bottom: 1.5rem;
        }

        .prompt-box {
            background: var(--bg-tertiary);
            padding: 1.25rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .prompt-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .prompt-text {
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 1rem;
            white-space: pre-wrap;
        }

        .model-card {
            background: var(--bg-tertiary);
            padding: 1.25rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .model-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .model-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .model-actions {
            display: flex;
            gap: 0.5rem;
        }

        .model-dimensions {
            margin-bottom: 1rem;
        }

        .model-final-score {
            text-align: center;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: 0.375rem;
        }

        .icon {
            width: 1rem;
            height: 1rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Content will be rendered here by JavaScript -->
    </div>

    <!-- Add Category Modal -->
    <div id="addCategoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Category</h2>
                <button class="modal-close" onclick="closeModal('addCategoryModal')">&times;</button>
            </div>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" id="categoryName" required>
                </div>
                <div class="form-group">
                    <label>Test Prompt</label>
                    <textarea id="categoryPrompt" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Category</button>
            </form>
        </div>
    </div>

    <!-- Add/Edit Model Result Modal -->
    <div id="modelResultModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modelResultModalTitle">Add Model Result</h2>
                <button class="modal-close" onclick="closeModal('modelResultModal')">&times;</button>
            </div>
            <form id="modelResultForm">
                <div class="form-group">
                    <label>Model</label>
                    <select id="resultModel" required>
                        <option value="">Select a model...</option>
                    </select>
                </div>
                <div id="dimensionsContainer">
                    <!-- Star ratings will be inserted here dynamically -->
                </div>
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <textarea id="resultNotes" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Final Score (calculated automatically)</label>
                    <input type="text" id="calculatedScore" readonly style="background: var(--bg-primary); font-size: 1.2rem; font-weight: 600; color: var(--accent);">
                </div>
                <button type="submit" class="btn btn-primary">Save Result</button>
            </form>
        </div>
    </div>

    <script>
        // SVG Icons as strings
        const icons = {
            trophy: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>',
            list: '<svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>',
            arrowLeft: '<svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>',
            plus: '<svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
            edit: '<svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
            trash: '<svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>',
            copy: '<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>'
        };

        // Category validation dimensions mapping
        const CATEGORY_DIMENSIONS = {
            'Writing & Tone': ['Style/Tone', 'Instruction Adherence'],
            'Reasoning & Logic': ['Reasoning', 'Accuracy'],
            'Coding': ['Accuracy', 'Instruction Adherence'],
            'Research & Current Info': ['Accuracy', 'Hallucination (inverse)'],
            'Instruction Following': ['Instruction Adherence']
        };

        // Helper function to get dimensions for a category
        function getDimensionsForCategory(categoryName) {
            // Return predefined dimensions if they exist
            if (CATEGORY_DIMENSIONS[categoryName]) {
                return CATEGORY_DIMENSIONS[categoryName];
            }
            // Default dimensions for custom categories
            return ['Accuracy', 'Instruction Adherence'];
        }

        // Data Store
        class TrackerStore {
            constructor() {
                this.availableModels = [
                    { id: '1', name: 'ChatGPT (GPT-4o free)' },
                    { id: '2', name: 'Claude (Sonnet 4.5 free)' },
                    { id: '3', name: 'Gemini 3' },
                    { id: '4', name: 'DeepSeek (V3/R1 free)' },
                    { id: '5', name: 'Grok 2 (free with X)' },
                    { id: '6', name: 'Llama (via Meta.ai)' }
                ];
                this.categories = [];
                this.categoryResults = {}; // { categoryId: { modelId: { dimensions: {}, finalScore: 0 } } }
                this.loadData();
            }

            loadData() {
                const stored = localStorage.getItem('trackerData');
                if (stored) {
                    const data = JSON.parse(stored);
                    this.categories = data.categories || [];
                    this.categoryResults = data.categoryResults || {};
                }

                // Initialize with default categories if empty
                if (this.categories.length === 0) {
                    this.initializeDefaultCategories();
                }
            }

            initializeDefaultCategories() {
                this.categories = [
                    {
                        id: '1',
                        name: 'Writing & Tone',
                        prompt: 'Write a polite but firm email to a client telling them we are pausing their project because they haven\'t paid their invoice for 3 months. Do not use the words \'regret,\' \'unfortunately,\' \'sincerely,\' or \'delve.\' Keep it under 100 words. Tone: Professional but cold.'
                    },
                    {
                        id: '2',
                        name: 'Reasoning & Logic',
                        prompt: 'A farmer has a wolf, a goat, and a cabbage. He must cross a river with a boat that can only hold him and one other item. If left alone, the wolf eats the goat, and the goat eats the cabbage. However, this time, the wolf is currently sleeping and will not wake up for exactly 1 trip. How does this change the solution? Provide the step-by-step moves.'
                    },
                    {
                        id: '3',
                        name: 'Coding',
                        prompt: 'Create a single-file Python script for a number guessing game. The computer picks a random number between 1-100. The player guesses, and the game says \'higher\' or \'lower.\' Track the number of attempts. When they win, show attempts and ask to play again. No explanations, just the code block.'
                    },
                    {
                        id: '4',
                        name: 'Research & Current Info',
                        prompt: 'What is the most significant AI-related news from the past 7 days? Give me 3 items with one-sentence summaries.'
                    },
                    {
                        id: '5',
                        name: 'Instruction Following',
                        prompt: 'Write a 4-line poem about coffee. Line 1 must start with \'M\'. Line 2 must contain exactly 6 words. Line 3 must be a question. Line 4 must rhyme with line 1. Do not explain your choices.'
                    }
                ];
                this.categoryResults = {};
                this.saveData();
            }

            saveData() {
                localStorage.setItem('trackerData', JSON.stringify({
                    categories: this.categories,
                    categoryResults: this.categoryResults
                }));
            }

            addCategory(name, prompt) {
                const category = {
                    id: Date.now().toString(),
                    name,
                    prompt
                };
                this.categories.push(category);
                this.categoryResults[category.id] = {};
                this.saveData();
                return category;
            }

            deleteCategory(id) {
                this.categories = this.categories.filter(c => c.id !== id);
                delete this.categoryResults[id];
                this.saveData();
            }

            addOrUpdateModelResult(categoryId, modelId, dimensionScores, notes = '') {
                if (!this.categoryResults[categoryId]) {
                    this.categoryResults[categoryId] = {};
                }

                // Calculate final score (average of dimension scores, scaled to 10)
                const scores = Object.values(dimensionScores);
                const avgStars = scores.reduce((a, b) => a + b, 0) / scores.length;
                const finalScore = (avgStars * 2).toFixed(1); // Convert 5-star to 10-point scale

                this.categoryResults[categoryId][modelId] = {
                    dimensions: dimensionScores,
                    finalScore: parseFloat(finalScore),
                    notes
                };

                this.saveData();
            }

            deleteModelFromCategory(categoryId, modelId) {
                if (this.categoryResults[categoryId]) {
                    delete this.categoryResults[categoryId][modelId];
                    this.saveData();
                }
            }

            getModelResultsForCategory(categoryId) {
                return this.categoryResults[categoryId] || {};
            }

            getCategoryWinner(categoryId) {
                const results = this.getModelResultsForCategory(categoryId);
                let winner = null;
                let highestScore = 0;

                Object.entries(results).forEach(([modelId, data]) => {
                    if (data.finalScore > highestScore) {
                        highestScore = data.finalScore;
                        winner = this.availableModels.find(m => m.id === modelId);
                    }
                });

                return winner ? { model: winner, ...results[winner.id] } : null;
            }

            getCategoryById(id) {
                return this.categories.find(c => c.id === id);
            }
        }

        // App State
        const store = new TrackerStore();
        let currentView = 'dashboard';
        let currentTab = 'best';
        let selectedCategory = null;
        let editingModelId = null;
        let currentDimensionScores = {};

        // Modal Functions
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Utility Functions
        function renderStars(rating) {
            let html = '<div class="star-rating">';
            for (let i = 1; i <= 5; i++) {
                html += `<span class="star ${i <= rating ? 'filled' : ''}">★</span>`;
            }
            html += '</div>';
            return html;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Prompt copied to clipboard!');
            });
        }

        // Render Functions
        function render() {
            const app = document.getElementById('app');

            if (currentView === 'category-detail' && selectedCategory) {
                app.innerHTML = renderCategoryDetail(selectedCategory);
            } else {
                app.innerHTML = renderMainView();
            }
        }

        function renderMainView() {
            return `
                <h1 class="app-title">AI Model Comparison Tracker</h1>
                <div class="tabs">
                    <div class="tabs-list">
                        <button class="tab-trigger ${currentTab === 'best' ? 'active' : ''}" onclick="switchTab('best')">
                            ${icons.trophy}
                            Best by Category
                        </button>
                        <button class="tab-trigger ${currentTab === 'categories' ? 'active' : ''}" onclick="switchTab('categories')">
                            ${icons.list}
                            Categories
                        </button>
                    </div>

                    <div class="tab-content ${currentTab === 'best' ? 'active' : ''}">
                        ${renderBestByCategory()}
                    </div>

                    <div class="tab-content ${currentTab === 'categories' ? 'active' : ''}">
                        ${renderCategoriesList()}
                    </div>
                </div>
            `;
        }

        function renderBestByCategory() {
            if (store.categories.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">${icons.trophy}</div>
                        <h3>No categories yet</h3>
                        <p>Go to the Categories tab to add your first category</p>
                    </div>
                `;
            }

            return `
                <div class="grid">
                    ${store.categories.map(category => {
                        const winner = store.getCategoryWinner(category.id);
                        const dimensions = getDimensionsForCategory(category.name);

                        return `
                            <div class="scorecard">
                                <div class="scorecard-header">
                                    <h3 class="scorecard-category">${category.name}</h3>
                                    ${winner ? `
                                        <div class="scorecard-winner">
                                            ${icons.trophy}
                                            ${winner.model.name}
                                        </div>
                                    ` : '<p style="color: var(--text-muted); font-size: 0.875rem;">No results yet</p>'}
                                </div>
                                ${winner ? `
                                    <div class="scorecard-dimensions">
                                        ${dimensions.map(dim => `
                                            <div class="dimension-row">
                                                <span class="dimension-name">${dim}</span>
                                                ${renderStars(winner.dimensions[dim] || 0)}
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="scorecard-final">
                                        <div class="final-score-label">Final Score</div>
                                        <div class="final-score-value">${winner.finalScore}/10</div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderCategoriesList() {
            return `
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">All Categories</h2>
                        <button class="btn btn-primary" onclick="openModal('addCategoryModal')">
                            ${icons.plus}
                            Add Category
                        </button>
                    </div>
                    ${store.categories.length === 0 ? `
                        <div class="empty-state">
                            <p>No categories yet. Add one to get started!</p>
                        </div>
                    ` : store.categories.map(category => `
                        <div class="category-list-item" onclick="viewCategory('${category.id}')">
                            <div class="category-list-name">${category.name}</div>
                            <div style="color: var(--text-muted); font-size: 0.875rem;">
                                ${Object.keys(store.getModelResultsForCategory(category.id)).length} models tested
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCategoryDetail(category) {
            const results = store.getModelResultsForCategory(category.id);
            const dimensions = getDimensionsForCategory(category.name);

            return `
                <button class="btn btn-secondary back-btn" onclick="backToDashboard()">
                    ${icons.arrowLeft}
                    Back to Categories
                </button>

                <h1 style="margin-bottom: 2rem;">${category.name}</h1>

                <div class="prompt-box">
                    <div class="prompt-label">TEST PROMPT</div>
                    <div class="prompt-text">${category.prompt}</div>
                    <button class="btn btn-secondary btn-small" onclick="copyToClipboard(\`${category.prompt.replace(/`/g, '\\`')}\`)">
                        ${icons.copy}
                        Copy Prompt
                    </button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Model Results</h2>
                        <button class="btn btn-primary" onclick="openAddModelModal('${category.id}')">
                            ${icons.plus}
                            Add Model
                        </button>
                    </div>

                    ${Object.keys(results).length === 0 ? `
                        <div class="empty-state">
                            <p>No models tested yet. Add a model to start comparing!</p>
                        </div>
                    ` : Object.entries(results).map(([modelId, data]) => {
                        const model = store.availableModels.find(m => m.id === modelId);
                        return `
                            <div class="model-card">
                                <div class="model-card-header">
                                    <div class="model-name">${model ? model.name : 'Unknown Model'}</div>
                                    <div class="model-actions">
                                        <button class="btn btn-secondary btn-small" onclick="editModel('${category.id}', '${modelId}')">
                                            ${icons.edit}
                                            Edit
                                        </button>
                                        <button class="btn btn-danger btn-small" onclick="deleteModel('${category.id}', '${modelId}')">
                                            ${icons.trash}
                                            Delete
                                        </button>
                                    </div>
                                </div>
                                <div class="model-dimensions">
                                    ${dimensions.map(dim => `
                                        <div class="dimension-row">
                                            <span class="dimension-name">${dim}</span>
                                            ${renderStars(data.dimensions[dim] || 0)}
                                        </div>
                                    `).join('')}
                                </div>
                                ${data.notes ? `<p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1rem;">Notes: ${data.notes}</p>` : ''}
                                <div class="model-final-score">
                                    <div class="final-score-label">Final Score</div>
                                    <div class="final-score-value">${data.finalScore}/10</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }


        // Event Handlers
        function switchTab(tab) {
            currentTab = tab;
            render();
        }

        function viewCategory(categoryId) {
            selectedCategory = store.getCategoryById(categoryId);
            currentView = 'category-detail';
            render();
        }

        function backToDashboard() {
            currentView = 'dashboard';
            selectedCategory = null;
            currentTab = 'categories';
            render();
        }

        function deleteModel(categoryId, modelId) {
            const model = store.availableModels.find(m => m.id === modelId);
            if (confirm(`Are you sure you want to delete ${model.name} from this category?`)) {
                store.deleteModelFromCategory(categoryId, modelId);
                render();
            }
        }

        function openAddModelModal(categoryId) {
            editingModelId = null;
            currentDimensionScores = {};
            document.getElementById('modelResultModalTitle').textContent = 'Add Model Result';

            const category = store.getCategoryById(categoryId);
            const dimensions = getDimensionsForCategory(category.name);

            const select = document.getElementById('resultModel');
            select.disabled = false;
            select.innerHTML = '<option value="">Select a model...</option>' +
                store.availableModels.map(m => `<option value="${m.id}">${m.name}</option>`).join('');

            document.getElementById('resultNotes').value = '';
            document.getElementById('calculatedScore').value = 'N/A';

            setupDimensionInputs(dimensions, {});
            openModal('modelResultModal');
        }

        function editModel(categoryId, modelId) {
            editingModelId = modelId;
            const category = store.getCategoryById(categoryId);
            const results = store.getModelResultsForCategory(categoryId);
            const modelData = results[modelId];
            currentDimensionScores = { ...modelData.dimensions };

            document.getElementById('modelResultModalTitle').textContent = 'Edit Model Result';

            const dimensions = getDimensionsForCategory(category.name);
            const select = document.getElementById('resultModel');
            select.disabled = true;
            select.innerHTML = store.availableModels
                .filter(m => m.id === modelId)
                .map(m => `<option value="${m.id}" selected>${m.name}</option>`)
                .join('');

            document.getElementById('resultNotes').value = modelData.notes || '';
            document.getElementById('calculatedScore').value = modelData.finalScore + '/10';

            setupDimensionInputs(dimensions, modelData.dimensions);
            openModal('modelResultModal');
        }

        function setupDimensionInputs(dimensions, scores) {
            const container = document.getElementById('dimensionsContainer');
            container.innerHTML = dimensions.map(dim => {
                const score = scores[dim] || 0;
                return `
                    <div class="form-group">
                        <label>${dim}</label>
                        <div class="star-rating-input" data-dimension="${dim}">
                            ${[1, 2, 3, 4, 5].map(star => `
                                <span class="star-input ${star <= score ? 'active' : ''}" data-value="${star}" onclick="setDimensionScore('${dim}', ${star})">★</span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setDimensionScore(dimension, score) {
            currentDimensionScores[dimension] = score;

            // Update star visuals
            const container = document.querySelector(`[data-dimension="${dimension}"]`);
            container.querySelectorAll('.star-input').forEach((star, index) => {
                if (index < score) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });

            // Calculate and display final score
            updateCalculatedScore();
        }

        function updateCalculatedScore() {
            const scores = Object.values(currentDimensionScores);
            if (scores.length > 0) {
                const avgStars = scores.reduce((a, b) => a + b, 0) / scores.length;
                const finalScore = (avgStars * 2).toFixed(1);
                document.getElementById('calculatedScore').value = finalScore + '/10';
            } else {
                document.getElementById('calculatedScore').value = 'N/A';
            }
        }

        // Form Handlers
        document.getElementById('addCategoryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('categoryName').value;
            const prompt = document.getElementById('categoryPrompt').value;
            store.addCategory(name, prompt);
            closeModal('addCategoryModal');
            document.getElementById('addCategoryForm').reset();
            render();
        });

        document.getElementById('modelResultForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const modelId = editingModelId || document.getElementById('resultModel').value;
            const notes = document.getElementById('resultNotes').value;

            if (!modelId) {
                alert('Please select a model');
                return;
            }

            const dimensions = getDimensionsForCategory(selectedCategory.name);
            if (Object.keys(currentDimensionScores).length !== dimensions.length) {
                alert('Please rate all dimensions');
                return;
            }

            store.addOrUpdateModelResult(selectedCategory.id, modelId, currentDimensionScores, notes);
            closeModal('modelResultModal');
            document.getElementById('modelResultForm').reset();
            currentDimensionScores = {};
            editingModelId = null;
            render();
        });

        // Close modal when clicking outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal.id);
                }
            });
        });

        // Initial render
        render();
    </script>
</body>
</html>
